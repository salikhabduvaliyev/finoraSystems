{% load i18n %}{% if v %}<button type='button' class='vcard{% if vertical %} is-v{% endif %}' data-play='{{ mode }}' data-src='{{ play }}' data-vertical='{{ vertical|yesno:"1,0" }}' data-title='{{ title }}' aria-label='{% translate "Videoni ko‘rish" %}: {{ title|default:label }}'>
<span class='vthumb vt-{{ kind }}'>{% if cover %}<img src='{{ cover }}' alt='' loading='lazy'>{% elif thumb %}<img src='{{ thumb }}' alt='' loading='lazy'>{% elif kind == 'file' %}<video src='{{ play }}#t=0.5' muted preload='metadata' playsinline tabindex='-1'></video>{% elif kind == 'instagram' %}<span class='igb' aria-hidden='true'></span>{% endif %}<span class='vbadge'>{{ label }}{% if vertical %} · Reels{% endif %}</span><span class='vpi' aria-hidden='true'></span></span>
{% if title %}<span class='vtitle'>{{ title }}</span>{% endif %}</button>{% endif %}
